<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Data Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>CSV Data Explorer</h1>
  <p>Upload any CSV and get an instant data profile: column types, missing values, summary stats and correlations.</p>
</header>

<main>
  <section class="upload panel">
    <input type="file" id="file" accept=".csv">
    <button id="analyze">Analyze</button>
    <span>or</span>
    <button id="sample" class="secondary">Try the sample dataset</button>
    <p id="status"></p>
  </section>

  <section id="results" hidden>
    <div class="kpis">
      <div class="card"><span class="label">File</span><span class="value small" id="r-name"></span></div>
      <div class="card"><span class="label">Rows</span><span class="value" id="r-rows"></span></div>
      <div class="card"><span class="label">Columns</span><span class="value" id="r-cols"></span></div>
    </div>

    <div class="panel"><h2>Columns</h2>
      <table id="t-columns"><thead><tr><th>Column</th><th>Type</th><th>Missing</th><th>Unique</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="grid">
      <div class="panel"><h2>Numeric summary</h2>
        <table id="t-numeric"><thead><tr><th>Column</th><th>Mean</th><th>Median</th><th>Std</th><th>Min</th><th>Max</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="panel"><h2>Strongest correlations</h2>
        <table id="t-corr"><thead><tr><th>Column A</th><th>Column B</th><th>r</th></tr></thead><tbody></tbody></table>
      </div>
    </div>

    <div class="panel"><h2>Preview (first 10 rows)</h2>
      <div class="scroll"><table id="t-preview"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
